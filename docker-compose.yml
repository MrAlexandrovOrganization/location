services:
  location:
    build: .
    restart: unless-stopped
    environment:
      ADDR: ":8080"
      METRICS_PORT: "9104"
      POSTGRES_URL: "postgres://location:${LOCATION_DB_PASSWORD:-location}@postgres:5432/location?sslmode=disable"
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - location-net
      - location-api-net
      - prometheus-net
      - jaeger-net

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: location
      POSTGRES_PASSWORD: ${LOCATION_DB_PASSWORD:-location}
      POSTGRES_DB: location
      # Read-only Grafana role (created by postgres/init/10-grafana-readonly.sh on first init)
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-grafana_ro_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U location"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - location-net
      - grafana-datasources-net

networks:
  location-net:
  location-api-net:
    name: location-api-net
  prometheus-net:
    external: true
  jaeger-net:
    external: true
  grafana-datasources-net:
    external: true

volumes:
  postgres-data:
